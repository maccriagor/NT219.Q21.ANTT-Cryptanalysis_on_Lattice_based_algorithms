name: ARM64 Performance Benchmark
on: [push, workflow_dispatch]

jobs:
  benchmark-arm:
    # This MUST be the ARM runner to support your assembly code
    runs-on: ubuntu-24.04-arm 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Benchmark Script
        run: |
          chmod +x run_all.sh
          # We use 'tee' so we can see the data in the logs while saving it
          ./run_all.sh | tee results_arm64.csv

      - name: Upload Results & Binary
        # Updated to v6 to match your Checkout action and resolve deprecation warnings
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-arm64
          path: |
            results_arm64.csv
            app_arm_binary
