name: ARM64 Performance Benchmark
on: [push, workflow_dispatch]

jobs:
  benchmark-arm:
    runs-on: ubuntu-latest  # or ubuntu-24.04 if ARM64 runner is not available
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Benchmark Script
        run: |
          chmod +x run_all.sh
          ./run_all.sh > results_arm64.csv

      - name: Upload Results & Binary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-arm64
          path: |
            results_arm64.csv
            app_arm_binary
