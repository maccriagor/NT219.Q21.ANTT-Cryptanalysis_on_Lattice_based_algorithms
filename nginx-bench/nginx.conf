# nginx.conf - TLS 1.3 PQC server for direct (non-emulated) handshake benchmarking.
# Mirrors the Open Quantum Safe nginx demo (openquantumsafe/nginx) but uses our
# OpenSSL 3.6.2 native ML-KEM: groups via ssl_ecdh_curve (nginx issue #532),
# session resumption OFF -> every connection is a FULL handshake.
worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    server {
        listen 127.0.0.1:4433 ssl;
        ssl_certificate     server.crt;
        ssl_certificate_key server.key;
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519:X25519MLKEM768:MLKEM768;
        ssl_session_cache   off;
        ssl_session_tickets off;
        location / { return 200 "ok\n"; }
    }
}
