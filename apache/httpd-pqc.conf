# httpd-pqc.conf — Apache TLS 1.3 với nhóm hybrid hậu lượng tử (OpenSSL 3.6.2 native).
# Tự cấu hình để tránh failure crypto: chỉ TLS 1.3, nhóm X25519MLKEM768 (hybrid) + x25519 (fallback),
# chứng chỉ ký bằng ML-DSA-65.
ServerRoot "/opt/httpd"
ServerName localhost
Listen 4443

LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule unixd_module       modules/mod_unixd.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule mime_module        modules/mod_mime.so
LoadModule dir_module         modules/mod_dir.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module         modules/mod_ssl.so

User daemon
Group daemon

ErrorLog "logs/error_log"
PidFile  "logs/httpd.pid"
LogFormat "%h %t \"%r\" %>s %b \"%{SSL_PROTOCOL}x\" \"%{SSL_CIPHER}x\"" pqc
CustomLog "logs/access_log" pqc
TypesConfig conf/mime.types
DocumentRoot "/opt/httpd/htdocs"
<Directory "/opt/httpd/htdocs">
    Require all granted
</Directory>

SSLSessionCache "shmcb:logs/ssl_scache(512000)"

<VirtualHost *:4443>
    ServerName localhost
    DocumentRoot "/opt/httpd/htdocs"

    SSLEngine on
    # Chỉ TLS 1.3 — bắt buộc cho ML-KEM/hybrid
    SSLProtocol -all +TLSv1.3
    # Nhóm hybrid PQC trước, x25519 dự phòng (tránh fail khi client cũ)
    SSLOpenSSLConfCmd Groups X25519MLKEM768:x25519
    # Chứng chỉ ký bằng ML-DSA-65 (sinh bởi gen-cert.sh)
    SSLCertificateFile    "/opt/httpd/conf/server.crt"
    SSLCertificateKeyFile "/opt/httpd/conf/server.key"
</VirtualHost>
